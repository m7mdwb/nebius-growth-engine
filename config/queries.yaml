# AEO monitor — the measurement contract.
#
# Everything the run depends on lives here, so a change to what we measure is a
# config change with a diff, not a code change. That matters more than it looks:
# a trend line is only comparable if the query set behind it did not move.

brand:
  name: Nebius Academy
  # Matched case-insensitively on word boundaries. Order matters only for reporting.
  aliases:
    - Nebius Academy
    - Nebius AI Academy
  # Products, tracked separately so we can tell brand-level from product-level
  # visibility. A product can be cited while the brand is absent.
  products:
    - name: Skillcheck
      aliases: [Skillcheck, Skill Check]
    - name: AI Learning Platform
      aliases: [Nebius AI Learning Platform]
    - name: Evolve
      aliases: [Nebius Evolve]
  # ⚠️ Disambiguation. "Nebius" alone is the parent AI-infrastructure company and
  # an answer about GPU cloud is NOT an education-brand mention. A bare "Nebius"
  # only counts when the surrounding text is about training/learning/upskilling.
  ambiguous:
    - term: Nebius
      requires_context: [academy, training, learning, upskill, course, education, skills]
  # Sibling brand. Tracked, never counted as the brand.
  related:
    - TripleTen

domains:
  owned:
    - nebius.com
    - academy.nebius.com
    - tripleten.com

# Seeds only. The extractor also discovers competitors we never listed — that
# discovery is the point, since the ones we don't know about are the finding.
competitor_seeds:
  - Coursera
  - Udemy
  - Udacity
  - Pluralsight
  - DataCamp
  - Skillsoft
  - Degreed
  - LinkedIn Learning
  - Section
  - Multiverse
  - O'Reilly
  - Google Cloud Skills Boost
  - AWS Skill Builder
  - Microsoft Learn
  - Docebo
  - 360Learning
  - Sana Labs
  - BCG
  - McKinsey
  - Deloitte

engines:
  claude:
    enabled: true
    live: true
    model: claude-sonnet-5
    # ⚠️ Was 2000 and that was measurably too low — answers ended mid-sentence on
    # `max_tokens`, and a truncated answer under-reports every brand named after the
    # cut. That is a silent bias toward `absent`, i.e. toward flattering ourselves
    # about competitors and unflattering about our own presence, in an instrument whose
    # entire job is counting who gets named. Truncation is now also flagged per answer.
    max_tokens: 4000
  ai_overviews:
    enabled: true
    live: true          # via Apify; falls back to a marked seam if APIFY_TOKEN is absent
    country: us
  chatgpt:
    enabled: true
    live: false         # SEAM — no key. Returns fixture data, flagged in the UI.
  perplexity:
    enabled: true
    live: false         # SEAM — no key. Returns fixture data, flagged in the UI.

# The written AEO recommendations (aeo/recommend.py). Opus, because this is the one
# step that is pure judgement over a table of evidence — and the step whose output a
# CMO actually reads.
#
# ⚠️ max_tokens was 3,000 and that truncated on a full run: five recommendations, each
# with reasoning, an evidence list and a measurement, plus the SEO verdict, does not
# fit. The failure now names itself ("hit max_tokens and was truncated") rather than
# surfacing as "not valid JSON", which sent me looking for a schema bug that did not
# exist. Generous on purpose — this runs once per run, not once per query.
recommendations:
  model: claude-opus-5
  max_tokens: 8000

run:
  # Repeats per query per engine. THIS IS THE POINT: LLM answers are
  # non-deterministic, so one sample is not a measurement. 3 is the demo setting;
  # production would run 5 and report a confidence band.
  repeats: 3
  # Only repeat this many queries (the rest run once) to keep a demo run cheap.
  # Set to null to repeat every query.
  repeat_subset: 4
  locale: en-US

# =========================================================================
# THE BENCHMARK — exactly ten buyer-intent queries.
# =========================================================================
#
# Reported as a COUNT, never a percentage: "we appear in 3 of 10". Target is 10 of 10.
#
# 🔑 Why a count and not a rate. A percentage invites a denominator nobody checks —
# 30% could be 3 of 10 or 3 of 10 with four cells unmeasured, and the second is not a
# result. Ten named queries you can read down the page is a number a CMO can argue
# with. It also makes the target concrete: not "improve visibility 20%", but "we lose
# these seven specific questions, here is who wins them instead".
#
# ⚠️ BRANDED QUERIES ARE NOT IN THE TEN. They sit below as `benchmark: false` controls.
# "What is Nebius Academy" returns Nebius Academy, so including branded queries in the
# headline count inflates it for free and makes 10 of 10 reachable without winning a
# single buyer question. They are still worth asking — if we ever lose our own name,
# nothing else on this page matters — but they are a sanity check, not the score.
#
# The ten below are the questions an enterprise L&D or transformation lead actually
# types before they know any vendor's name. Three shapes, deliberately mixed:
#   category   — high commercial intent, hardest to win, most contested
#   problem    — asked BEFORE the buyer knows a vendor category exists; cheapest to win
#   assessment — Skillcheck's territory specifically
#   buying     — late funnel, high intent, low competition, usually neglected
queries:
  # --- Category. Highest commercial intent, hardest to win. ---
  - id: q01
    text: best AI readiness training for enterprises
    intent: category
    benchmark: true
  - id: q02
    text: best corporate AI upskilling programs
    intent: category
    benchmark: true
  - id: q03
    text: enterprise AI training providers
    intent: category
    benchmark: true

  # --- Problem-shaped. Asked before the buyer knows any vendor exists. ---
  - id: q04
    text: how do we upskill our team on AI
    intent: problem
    benchmark: true
  - id: q05
    text: our employees aren't using AI, where do we start
    intent: problem
    benchmark: true
  - id: q06
    text: how to build an AI adoption program for a 500-person company
    intent: problem
    benchmark: true

  # --- Comparison. The buyer already has a shortlist; are we on it? ---
  - id: q07
    text: build vs buy AI training for employees
    intent: comparison
    benchmark: true

  # --- Assessment. Skillcheck's territory. ---
  - id: q08
    text: AI skills assessment tools for enterprises
    intent: assessment
    benchmark: true
  - id: q09
    text: how to measure employee AI readiness
    intent: assessment
    benchmark: true

  # --- Buying process. Late funnel, high intent, low competition. ---
  - id: q10
    text: how much does corporate AI training cost
    intent: buying
    benchmark: true

  # --- Controls. Asked and reported, but NOT part of the ten. ---
  - id: c01
    text: what is Nebius Academy
    intent: branded
    benchmark: false
  - id: c02
    text: Nebius Academy reviews
    intent: branded
    benchmark: false
