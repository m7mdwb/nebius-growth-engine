name: AEO run (on demand)

# The "make it recurring" bonus, built and then deliberately left switched off.
#
# Measuring AI visibility once is a screenshot; measuring it on a schedule against a
# frozen query set is a baseline, and the baseline is the only thing that makes a
# later improvement legible. Everything that makes a run *comparable* is built and
# working — `runs.query_set_hash` fingerprints the measurement contract so a changed
# query set breaks the trend line instead of pretending the two halves are the same
# thing, repeats measure the noise band, and the trend view reads the history. The
# recurrence is one uncommented line away.
#
# 💰 WHY IT IS OFF, and this is a scope call rather than an omission. A full run is
# 80 steps costing **~$2.45** — and that number was wrong until the run started
# reporting its own spend: the first estimate said $0.80–1.10 because it counted
# tokens and forgot that the web_search tool bills $10 per 1,000 searches, which is
# ~$0.80 of a single run on its own. At the corrected figure a Mon/Wed/Fri cron is
# **~$32/month on a personal API key** — a key that has already hit zero once
# mid-run. Paying that continuously to detect movement on a brand currently absent
# from 10 of 10 queries is buying a baseline nobody is reading yet.
#
# Turn it on when there is something to detect: after the first placements land, when
# a re-run would actually be expected to move. Until then this is `workflow_dispatch`
# — a "Run workflow" button, on demand, for free.
#
# ⚠️ THIS RUNS TRACK C ONLY. Track A scrapes real people and must never run
# unattended on a shared runner — see the guard before the commit step.

on:
  # schedule:
  #   - cron: "0 6 * * 1,3,5"    # Mon/Wed/Fri 06:00 UTC — ~$32/month, see above
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeo-run
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A secret that is not listed under `env:` never reaches the process.
      # Easy to miss, and it fails as a silent zero rather than an error.
      - name: Collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m aeo.run --label scheduled

      # Redacted by default. Track A rows should not exist here at all (see the guard
      # below), but the export defends itself rather than trusting that.
      - name: Export standalone report
        run: python -m aeo.report

      - uses: actions/upload-artifact@v4
        with:
          name: aeo-report
          path: out/aeo_report.html
          retention-days: 30

      # 🔑 CONSTRAINT 4, enforced rather than assumed.
      #
      # The step below force-adds a gitignored database, and that database has a
      # `leads` table that can hold scraped names, work emails, LinkedIn URLs and
      # drafted messages. Committing it would publish real people's data into the
      # repository on a schedule — quietly, correctly, every Monday.
      #
      # CI only ever runs Track C, so the table should be empty. "Should be" is not a
      # control. This fails the job loudly if it is not.
      - name: Refuse to commit if any personal data is present
        run: |
          n=$(python -c "
          import sqlite3
          c = sqlite3.connect('data/aeo.db')
          try:
              print(c.execute('SELECT COUNT(*) FROM leads').fetchone()[0])
          except sqlite3.OperationalError:
              print(0)
          ")
          echo "leads rows: $n"
          if [ "$n" != "0" ]; then
            echo "::error::data/aeo.db contains $n lead row(s). Track A scrapes real"
            echo "::error::people and this file is about to be committed. Refusing."
            exit 1
          fi

      - name: Commit the day's rows
        run: |
          git config user.name  "aeo-bot"
          git config user.email "aeo-bot@users.noreply.github.com"
          git add -f data/aeo.db
          git diff --staged --quiet || git commit -m "AEO run $(date -u +%F)"
          git push
