name: AEO daily

# The "make it recurring" bonus. Measuring AI visibility once is a screenshot;
# measuring it on a schedule against a frozen query set is a baseline, and the
# baseline is the only thing that makes a later improvement legible.
#
# The database is committed back to the branch, so history accumulates in the
# repo with no external storage. Fine at this volume; a real deployment would
# push rows to a warehouse instead.

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeo-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A secret that is not listed under `env:` never reaches the process.
      # Easy to miss, and it fails as a silent zero rather than an error.
      - name: Collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m aeo.run --label scheduled

      - name: Export standalone report
        run: python -m aeo.report

      - uses: actions/upload-artifact@v4
        with:
          name: aeo-report
          path: out/aeo_report.html
          retention-days: 30

      - name: Commit the day's rows
        run: |
          git config user.name  "aeo-bot"
          git config user.email "aeo-bot@users.noreply.github.com"
          git add -f data/aeo.db
          git diff --staged --quiet || git commit -m "AEO run $(date -u +%F)"
          git push
