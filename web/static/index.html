        `Live now: ${live.map(e => esc(e.label)).join(" · ") || "none"}. One adapter per surface, all returning the same shape.`,
        `${live.length} of ${engines.length}`,
        `Claude answers with the <code>web_search</code> tool; AI Overviews comes through Apify.
         ${cost.calls ? `This run: <b>$${cost.usd.toFixed(4)}</b> over ${cost.calls} calls and ${cost.searches} searches, read from <code>response.usage</code>.`
                      : "This run predates the usage instrumentation, so it reports no cost rather than a $0.00 that would read as free."}`)}
      ${seams.map(e => exit(`${e.label} — no key, declared seam`, e.obs,
        "never called; stored is_live=0", "seam")).join("")}

      ${stage(3, "paid", "Repeat, because one sample is not a measurement",
        `Up to ${maxRepeats} readings of the same query on the same engine, on a subset — the rest run once, to keep a demo run affordable.`,
        totalObs,
        `${v.repeated_cells || 0} cells were read more than once and <b>${v.unstable_cells || 0} of them disagreed with themselves</b>. That spread is the noise floor: movement smaller than it is not a result, and a tool that collected one sample per cell could not know that.`)}

      ${stage(4, "rules", "Classify each answer",
        "Word-boundary match on the brand and its aliases, then on the cited domains. <i>Cited</i> outranks <i>mentioned</i>; a bare “Nebius” only counts with training context around it, because the parent company is an AI-infrastructure business.",
        liveObs,
        "The classification is a lookup over the answer text — no model is asked whether we appeared, because an instrument that re-decides its own definition between runs cannot measure change.")}
      <div class="froutes">
        ${exit("Cited — the answer carried a link", st.cited, "the strongest form of presence", "hot")}
        ${exit("Mentioned — named, no link", st.mentioned, "recall without traffic; a different fix", "warm")}
        ${exit("Absent — we asked, we were not there", st.absent, "a measurement, and the finding", "")}
        ${exit("Dead air — asked, nothing came back", Math.max(deadAir, 0),
          "error, refusal or an empty answer — unmeasured, never absent", "seam")}
      </div>

      ${stage(5, "rules", "The benchmark — a count, never a percentage",
        `Won = any engine, on any repeat, cited <i>or</i> mentioned. Deliberately generous: the headline asks “did we show up at all”, and the cited/mentioned split is carried in the rows above where it can be acted on.`,
        `${bench.appear_in} of ${bench.out_of}`,
        `A percentage hides its denominator, and the denominator is where these dashboards lie — 30% reads identically whether it is 3 of 10 measured or 3 of 10 with four cells never looked at.
         ${st.cited && !benchCited ? `<b>Every citation in this run landed on a branded control.</b> We are cited when someone types our name and absent from all ${bench.out_of} questions a buyer types instead — which is the whole reason the controls are not in the count.` : ""}`)}
      ${exit("Not measured — held out of the denominator", (bench.unmeasured || []).length,
        "named on the page, not folded in: “3 of 10” and “3 of 8” are different claims", "seam")}

      ${stage(6, "rules", "The source gap — what won instead",
        `For every query we lost, classify each cited domain by <b>what kind of thing it is</b>: review platform, competitor-owned, analyst, community, editorial.`,
        gap.lost_queries || 0,
        `<b>${classified}</b> citations classified on the lost queries.
         ${(gap.kinds || []).length ? `<div style="margin:5px 0">${gap.kinds.map(k => `${esc(k.label)} <b>${k.citations}</b>`).join(" &nbsp;·&nbsp; ")}</div>` : ""}
         <b>A lookup, not a model call</b>, for the same reason as the scoring in Track A: a source type that changed its mind between runs would make every recommendation unreproducible. This is the step that turns a scoreboard into a list of places to go and get placed.`)}

      ${stage(7, "rules", "Does SEO feed AEO?",
        "Of the domains the AI answer cited, how many were also ranking organically for the same query — captured from the same response, not a second search.",
        seo.queries_compared || 0,
        seo.queries_compared
          ? `${seo.also_ranking_organically} of ${seo.cited_domains} cited domains were also in the organic results.
             ${seo.verdict ? `<b>${esc(seo.verdict)}</b>` : "<b>Too few queries to call it</b>, and reported with the sample size attached rather than as a figure that would be read as settled."}`
          : "Only Google AI Overviews exposes both the generative answer and the SERP beneath it, so this is measurable on that engine alone — and unmeasurable on this run rather than assumed.")}

      ${stage(8, "model", "Recommendations — the one thing rules cannot do",
        "3–5 concrete moves, written from the benchmark, the source gap and the overlap figure.",
        null,
        "The <b>only</b> model call in the analysis path, and it never sees the raw answers — it is handed the evidence tables above and nothing else. A model given raw answers returns five bullets that would be identical for any company in any category; a model given a table it cannot argue with has to name specific domains. Generated on demand from the Track C tab: one Opus call, about $0.15.")}
    </div>

    <div class="note"><b>Only the last step is a model.</b> Everything above it is a
      lookup, a word-boundary match or arithmetic — same collection, same config, same
      benchmark, every time. The model writes prose about a measurement that was already
      taken; it never decides whether we appeared.</div>
    <div class="note warn"><b>Two hatched paths, and they are not the same claim.</b>
      ${seamObs} readings were never collected because there is no key for those engines,
      and ${Math.max(deadAir, 0)} were asked for and came back empty. Both are stored as
      <code>unmeasured</code> and both are excluded from every rate — but a run where the
      second number climbs is a broken instrument, and one where only the first is high is
      simply a narrower one. Folding either into <i>absent</i> would report our own missing
      credentials as evidence about the market.</div>
  </section>`;
}

/* ------------------------------------------------------------------ load */

let TAB = "leads";
let CONFIG = null;
/* Which Track C run is on screen. null = whatever the server calls latest, which
   prefers a MEASURED run and only falls back to a seeded one when none exists. */
let RUN_ID = null;
let RUNS = null;
let TREND = null;

/* The picker exists because the seeded runs are not decoration — they are the same
   board with movement in it, and the only way to see what this tool looks like when
   the brand is actually winning. They are reachable rather than hidden, and the
   synthetic banner fires on `is_synthetic` in the payload, so switching to one
   cannot quietly pass seeded data off as measured. */
async function runPicker() {
  const el = $("#runpickwrap");
  if (!el) return;
  if (EMBED || !isTrackC()) { el.classList.remove("on"); el.innerHTML = ""; return; }
  if (!RUNS) {
    try { RUNS = await api("/api/runs"); } catch (e) { return; }
  }
  if (!RUNS.length) return;
  const dflt = [...RUNS].reverse().find(r => !r.is_synthetic) || RUNS[RUNS.length - 1];
  const opts = [...RUNS].reverse().map(r => {
    const on = RUN_ID ? String(r.id) === String(RUN_ID) : r.id === dflt.id;
    return `<option value="${r.id}"${on ? " selected" : ""}>run ${r.id} · ${
      esc((r.started_at || "").slice(0, 10))} · ${
      r.is_synthetic ? "SEEDED, not measured" : "measured"}</option>`;
  }).join("");

  /* A dropdown nobody opens is a feature nobody has. The seeded board is the only
     place this tool shows what it looks like when the brand is WINNING, and two
     reviewers in a row failed to find it behind a select labelled "Viewing" — so
     the jump is a button, and it says what it will show rather than which run id
     it will load. */
  const cur = RUNS.find(r => String(r.id) === String(RUN_ID)) || dflt;
  /* The BEST seeded run, not the most recent one. The seeded series is a decline
     (8 -> 7 -> 3 of 10), so "most recent" lands on the weakest board — which is the
     opposite of the point of the button. Presence comes from the trend endpoint,
     fetched once. */
  if (TREND === null) {
    try { TREND = await api("/api/trend"); } catch (e) { TREND = []; }
  }
  const presence = id => (TREND.find(p => p.run_id === id) || {}).presence_rate ?? -1;
  const target = RUNS.filter(r => r.is_synthetic)
                     .sort((a, b) => presence(b.id) - presence(a.id))[0];
  const jump = cur.is_synthetic
    ? `<button id="runjump" data-to="${dflt.id}">← Back to what we measured</button>`
    : (target ? `<button id="runjump" data-to="${target.id}">See what winning looks like →</button>` : "");

  el.innerHTML = `<label for="runsel">Showing</label>
    <select id="runsel">${opts}</select>${jump}`;
  el.classList.add("on");
}

/* Which credentials are present, and what each one turns on. PRESENCE ONLY —
   the value is never sent to the browser, so this is safe to leave on screen
   during a recorded walkthrough. It is also the answer to "can someone else run
   this?": add a key to .env, restart, the chip goes green and the seam closes. */
function keyChips(keys) {
  if (!keys || !keys.length) return;
  const el = $("#keys");
  if (!el) return;
  el.innerHTML = keys.map(k =>
    `<span class="keychip ${k.present ? "on" : ""}" title="${esc(k.unlocks)}">
       ${esc(k.name)} ${k.present ? "set" : "not set"}</span>`).join("");
}

/* The footer argues for whichever track is on screen. It used to carry Track C's
   score argument under the lead engine — the tab where citation share means
   nothing — which is the kind of leak that tells a reader nobody re-read the page
   after building it. */
const FOOTNOTES = {
  C: `The score is a total, not a verdict: presence, citation quality, citation share
      and answer rank each keep their own points on the page, and a component that
      could not be measured is held out of the denominator instead of scored as zero.
      A number you can take apart is a number you can argue with.`,
  A: `Rules decide and the model writes. The score is arithmetic over
      <code>config/leads.yaml</code> and every point shows its source; a factor we
      could not measure is named rather than scored as zero. The model infers pain
      points and writes the draft — it never touches the number, the route or the SLA.`,
};

function footnote() {
  const el = $("#footnote");
  if (el) el.innerHTML = isTrackC() ? FOOTNOTES.C : FOOTNOTES.A;
}

async function load() {
  footnote();
  if (!EMBED && !CONFIG) {
    try { CONFIG = await api("/api/config"); keyChips(CONFIG.keys); } catch (e) { /* offline export */ }
  }
  await runPicker();   // self-hides on the Track A tabs
  if (TAB === "leads" || TAB === "flow") {
    const d = EMBED ? EMBED.leads : await api("/api/leads");
    if (!d || d.empty) {
      $("#app").innerHTML = TAB === "flow"
        ? '<div class="empty">No lead run yet — the flowchart shows counts from a real run. Press <b>Run lead engine</b>.</div>'
        : '<div class="empty">No lead run yet. Press <b>Run lead engine</b>.</div>';
      return;
    }
    $("#app").innerHTML = "";
    /* The Logic tab is the mechanism: the flow FIRST, because it is the shape of the
       thing, then the rule tables the deciding stages read from. They used to sit
       under the lead cards, which put ~44 rows of policy on the tab whose job is
       showing what came out — the same category error as documenting an engine
       inside its own output. */
    if (TAB === "flow") {
      $("#app").innerHTML = flowChart(d) +
        (d.method ? scoringMethod(d.method) + enrichmentMethod(d.method) : "");
    } else renderLeads(d);
    $("#runmeta").textContent = `lead run ${d.run.id} · ${d.run.started_at} · fit ${d.run.fit_hash}`;
    return;
  }
  const d = EMBED ? EMBED.report
                  : await api("/api/report" + (RUN_ID ? "?run_id=" + RUN_ID : ""));
  if (!d || d.empty) {
    $("#app").innerHTML = TAB === "cflow"
      ? '<div class="empty">No Track C run yet — the flowchart carries the counts from a real collection. Press <b>Run live collection</b>.</div>'
      : '<div class="empty">No completed run in this export.</div>';
    return;
  }
  /* The Logic tab reads the same report payload, so it needs no second fetch —
     and deliberately does not ask for the trend it would never draw. */
  if (TAB === "cflow") {
    $("#app").innerHTML = flowChartC(d);
    const r = d.run || {};
    $("#runmeta").textContent = r.started_at
      ? `run ${r.id} · ${r.started_at} · engines: ${r.engines || "—"}`
      : "no completed runs";
    $("#hash").textContent = r.query_set_hash ? " · contract " + r.query_set_hash : "";
    return;
  }
  render(d, EMBED ? EMBED.trend : await api("/api/trend"));
}

/* ------------------------------------------------------------- live run */

async function poll() {
  const st = await api("/api/status");
  $("#pbar").style.width = st.steps ? (100 * st.step / st.steps) + "%" : "0%";
  $("#log").textContent = st.log.map(e =>
    e.event === "error" ? "ERROR " + e.message
    : `[${String(e.step).padStart(3)}/${e.steps}] ${e.engine.padEnd(14)}` +
      `${String(e.status).padEnd(10)}${String(e.citations).padStart(2)} cites  ` +
      `${e.query.slice(0, 44)}${e.live ? "" : "   [seam]"}`
  ).join("\n");
  $("#log").scrollTop = 1e6;
  if (st.running) { setTimeout(poll, 600); return; }
  $("#btnrun").disabled = false;
  $("#btnrun").textContent = runLabel();
  // A finished collection invalidates the picker: leaving RUN_ID pinned would show
  // the run you were reading before, immediately after pressing the button that
  // produced a newer one.
  RUN_ID = null; RUNS = null; TREND = null;
  await load();
}

/* Each Logic tab reads the run its own track produced, so its button runs the
   same thing that tab is a picture of. */
const isTrackC = () => TAB === "aeo" || TAB === "cflow";
const runLabel = () => isTrackC() ? "Run live collection" : "Run lead engine";

// Tabs work in the standalone export too, so a reviewer with no server can
// still see both tracks.
$("#tabs").onclick = async (e) => {
  const b = e.target.closest("button[data-tab]");
  if (!b || b.classList.contains("on")) return;
  [...$("#tabs").children].forEach(x => x.classList.toggle("on", x === b));
  TAB = b.dataset.tab;
  const run = $("#btnrun");
  if (run) run.textContent = runLabel();
  $("#app").innerHTML = '<div class="empty">loading…</div>';
  await load();
};

if (!EMBED) {
  $("#btnrun").onclick = async () => {
    $("#btnrun").disabled = true;
    $("#btnrun").textContent = "Running…";
    $("#runpanel").classList.add("on");
    $("#log").textContent = "";
    await api(isTrackC() ? "/api/run" : "/api/leads/run", { method: "POST" });
    poll();
  };
  $("#btnexport").onclick = async () => {
    $("#btnexport").disabled = true;
    const r = await api("/api/export", { method: "POST" });
    $("#btnexport").textContent = "Written to " + r.path.split(/[\\/]/).pop();
    setTimeout(() => { $("#btnexport").disabled = false; $("#btnexport").textContent = "Export standalone HTML"; }, 4000);
  };
} else {
  $("#actions").innerHTML = '<button id="btntheme">Theme</button>';
}

/* One delegated handler for everything rendered after load. The panels are
   re-created on every render, so binding directly would go stale. */
document.addEventListener("click", async e => {
  const t = e.target;
  if (!t) return;

  if (t.id === "runjump") {
    RUN_ID = t.dataset.to;
    $("#app").innerHTML = '<div class="empty">loading…</div>';
    await load();
    return;
  }

  if (t.id === "btntheme") {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    return;
  }

  /* ---- Track A: look up one real person ---- */
  if (t.id === "lf-go") {
    const email = $("#lf-email").value.trim();
    const out = $("#lf-out");
    if (!email.includes("@")) {
      out.innerHTML = `<div class="note warn"><b>A work email is required.</b> The domain is
        the only fact the reconciliation check can trust — it is the one thing a search
        engine did not propose to us.</div>`;
      return;
    }
    t.disabled = true; t.textContent = "Looking up…";
    out.innerHTML = `<div class="stages"><div class="stg now">starting the lookup…</div></div>`;

    /* Poll the real trace while the POST is in flight. The endpoint is a sync
       handler, so FastAPI serves it from a threadpool and /api/status stays
       answerable — which is what makes this show the live stage rather than a
       progress bar guessing at 20 seconds. */
    let polling = true;
    const tick = async () => {
      if (!polling) return;
      try {
        const st = await api("/api/status");
        const s = st.stages || [];
        if (s.length) out.innerHTML = stageRail(s, false);
      } catch (e) { /* a dropped poll is not worth surfacing */ }
      if (polling) setTimeout(tick, 450);
    };
    tick();

    try {
      const body = {
        first_name: $("#lf-first").value, last_name: $("#lf-last").value, email,
        signals: [...document.querySelectorAll(".lf-sig input:checked")].map(i => i.value),
      };
      const r = await api("/api/leads/one",
        { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body) });
      polling = false;
      // The finished rail stays above the card: it is the audit trail of this exact
      // lookup, and it is the most persuasive thing on the screen during a demo.
      let rail = "";
      try {
        const st = await api("/api/status");
        if ((st.stages || []).length) rail = stageRail(st.stages, true);
      } catch (e) { /* ignore */ }
      out.innerHTML = rail + (r.error
        ? `<div class="note warn"><b>Lookup failed.</b> ${esc(r.error)}</div>`
        // Opened, because you just asked for this one — the row you typed should not
        // need a second click to show what it found.
        : (r.lead ? leadCard(r.lead, true) : '<div class="note warn">No lead returned.</div>'));
      // The lead was appended to the run already on screen, so the table below is
      // now stale by exactly one row. Refresh it rather than leaving the person to
      // wonder where their lead went.
      if (!r.error && r.lead) setTimeout(() => refreshLeadTable(r.lead), 400);
    } catch (err) {
      polling = false;
      out.innerHTML = `<div class="note warn">${esc(String(err))}</div>`;
    }
    polling = false;
    t.disabled = false; t.textContent = "Find, score & draft";
    return;
  }

  /* ---- Track C: ad-hoc live query ---- */
  if (t.id === "ah-go") {
    const q = $("#ah-q").value.trim();
    if (!q) return;
    t.disabled = true; t.textContent = "Asking…";
    $("#ah-out").innerHTML = `<div class="stages"><div class="stg now">asking every enabled engine…</div></div>`;

    // Same live rail as the lead lookup — one line per engine, as it answers.
    let ahPoll = true;
    const ahTick = async () => {
      if (!ahPoll) return;
      try {
        const st = await api("/api/status");
        if ((st.stages || []).length) $("#ah-out").innerHTML = stageRail(st.stages, false);
      } catch (e) { /* ignore */ }
      if (ahPoll) setTimeout(ahTick, 450);
    };
    ahTick();

    try {
      const r = await api("/api/adhoc",
        { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q }) });
      ahPoll = false;
      let rail = "";
      try {
        const st = await api("/api/status");
        if ((st.stages || []).length) rail = stageRail(st.stages, true);
      } catch (e) { /* ignore */ }
      $("#ah-out").innerHTML = rail + (r.error
        ? `<div class="note warn">${esc(r.error)}</div>` : adhocResults(r));
    } catch (err) {
      ahPoll = false;
      $("#ah-out").innerHTML = `<div class="note warn">${esc(String(err))}</div>`;
    }
    ahPoll = false;
    t.disabled = false; t.textContent = "Ask";
    return;
  }

  /* ---- Track C: generate the written recommendations ---- */
  if (t.id === "btnrecs") {
    t.disabled = true; t.textContent = "Writing…";
    $("#recs-out").innerHTML = '<div class="empty">reading the benchmark, the source gap ' +
      'and the overlap figure…</div>';
    try {
      // Pinned to the run ON SCREEN, not to "latest" — generating advice from one
      // run while the reader is looking at another is how a dashboard lies politely.
      const r = await api("/api/recommendations" + (RUN_ID ? "?run_id=" + RUN_ID : ""));
      $("#recs-out").innerHTML = recsPanel(r);
    } catch (err) {
      $("#recs-out").innerHTML = `<div class="note warn">${esc(String(err))}</div>`;
    }
    t.disabled = false; t.textContent = "Regenerate";
  }
});

/* Switching runs re-reads the whole board from the server rather than filtering
   anything client-side — the benchmark, the source gap, the overlap and the score
   are all DERIVED per request, so an older run gets today's analysis rules applied
   to the answers it actually collected. */
document.addEventListener("change", async e => {
  if (!e.target || e.target.id !== "runsel") return;
  RUN_ID = e.target.value;
  $("#app").innerHTML = '<div class="empty">loading…</div>';
  await load();
});

/* Enter submits the field it is in. */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const id = e.target && e.target.id;
  if (id === "ah-q") $("#ah-go").click();
  if (id === "lf-first" || id === "lf-last" || id === "lf-email") $("#lf-go").click();
});

load();
</script>
</body>
</html>
