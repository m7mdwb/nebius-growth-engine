<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEO Monitor</title>
<!--EMBED-->
<style>
/* One file on purpose: the same page serves the local app and the standalone
   export, so styles and script are inline and nothing is fetched. */
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --surface-2:#f4f3ef; --plane:#f9f9f7;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --series-1:#2a78d6; --series-2:#eb6834;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --cell-cited:#0ca30c; --cell-mentioned:#fab219; --cell-absent:#f4f3ef;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-1:#1a1a19; --surface-2:#232322; --plane:#0d0d0d;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926;
    --cell-absent:#232322;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --surface-2:#232322; --plane:#0d0d0d;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --series-1:#3987e5; --series-2:#d95926;
  --cell-absent:#232322;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--plane); color:var(--ink);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1220px;margin:0 auto;padding:26px 20px 60px}

header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
h1 span{color:var(--muted);font-weight:400}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  background:var(--surface-1);color:var(--ink);
  border:1px solid var(--axis);border-radius:7px;padding:8px 14px;
}
button:hover:not(:disabled){background:var(--surface-2)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--series-1);border-color:var(--series-1);color:#fff}

section{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sub{font-size:13px;color:var(--ink-2);margin-bottom:14px;max-width:74ch}

/* ---- stat tiles: hero numbers, no chart ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.tile b{display:block;font-size:29px;font-weight:700;line-height:1.05;letter-spacing:-.5px}
.tile span{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.tile small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:6px}

/* ---- query x engine grid ---- */
.gridwrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:2px;width:100%;min-width:640px;table-layout:fixed}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:0 4px 6px;white-space:nowrap}
th.q{text-align:left;width:38%}
td.q{font-size:13px;color:var(--ink);padding:0 10px 0 2px;line-height:1.35}
td.q em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:1px}
td.cell{height:34px;text-align:center;border-radius:5px;font-size:12px;font-weight:700;color:#fff;position:relative}
.s-cited{background:var(--cell-cited)}
.s-mentioned{background:var(--cell-mentioned);color:#2a1f00}
.s-absent{background:var(--cell-absent);color:var(--muted);border:1px solid var(--grid)}
.s-seam{
  color:var(--muted);border:1px dashed var(--axis);
  background:repeating-linear-gradient(45deg,transparent,transparent 4px,var(--grid) 4px,var(--grid) 6px);
}
.cell .split{position:absolute;top:2px;right:4px;font-size:10px;font-weight:700;opacity:.95}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:6px}

/* ---- horizontal bars ---- */
.bars{display:flex;flex-direction:column;gap:8px}
/* Label sits in its own column, never on top of the fill. Text over a series
   colour is a contrast gamble that changes with every theme; text on the
   surface is legible in both. */
.bar{display:grid;grid-template-columns:minmax(0,150px) 1fr 40px;gap:11px;align-items:center}
.bar .lab{display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px;color:var(--ink)}
.bar .lab b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{background:var(--surface-2);border-radius:4px;height:20px;overflow:hidden}
.bar .fill{height:100%;background:var(--series-1);border-radius:0 4px 4px 0}
.bar .fill.owned{background:var(--good)}
.bar .n{text-align:right;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--good);border:1px solid var(--good);border-radius:3px;padding:0 4px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:880px){.two{grid-template-columns:1fr}}

/* ---- trend ---- */
svg{display:block;width:100%;height:auto;overflow:visible}
.axis-lab{font-size:11px;fill:var(--muted)}
.gridline{stroke:var(--grid);stroke-width:1}
.baseline{stroke:var(--axis);stroke-width:1}
.serieslab{font-size:11.5px;font-weight:600}

.note{background:var(--surface-2);border-left:3px solid var(--series-1);border-radius:0 6px 6px 0;padding:11px 14px;font-size:13.5px;color:var(--ink-2);margin-top:14px}
.note b{color:var(--ink)}
.warn{border-left-color:var(--warning)}

/* ---- run log ---- */
#runpanel{display:none}
#runpanel.on{display:block}
.progress{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:10px}
.progress i{display:block;height:100%;background:var(--series-1);width:0;transition:width .25s}
#log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-2);max-height:190px;overflow:auto;white-space:pre;line-height:1.6}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tabs button{border:0;border-radius:0;background:none;padding:9px 16px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--series-1)}
.tabs button:hover:not(:disabled){background:none;color:var(--ink)}

/* ---- lead cards ---- */
.lead{border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin-bottom:10px;background:var(--surface-1)}
.lead-head{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.lead-who b{font-size:15px;font-weight:700}
.lead-who span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.lead-right{display:flex;align-items:center;gap:9px;white-space:nowrap}
.score{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.score small{font-size:11px;color:var(--muted);font-weight:400}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:5px}
.r-sales_now{background:var(--good);color:#fff}
.r-sdr_queue{background:var(--series-1);color:#fff}
.r-nurture{background:var(--warning);color:#2a1f00}
.r-hold{background:var(--cell-absent);color:var(--muted);border:1px solid var(--grid)}
.r-disqualified{background:var(--critical);color:#fff}
.r-needs_review{color:var(--muted);border:1px dashed var(--axis);
  background:repeating-linear-gradient(45deg,transparent,transparent 4px,var(--grid) 4px,var(--grid) 6px)}
.why{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--grid);padding-left:10px;margin:9px 0}
.bd{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.bd span{font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:3px 8px;color:var(--ink-2)}
.bd span b{color:var(--ink);font-variant-numeric:tabular-nums}
.draft{background:var(--surface-2);border-radius:7px;padding:12px 14px;margin-top:10px;font-size:13.5px;white-space:pre-wrap;line-height:1.55;color:var(--ink)}
.ev{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.ev span{font-size:11px;background:transparent;border:1px solid var(--good);color:var(--good);border-radius:4px;padding:2px 7px}
.ev.none span{border-color:var(--critical);color:var(--critical)}

/* ---- method tables ---- */
.mt{width:100%;border-collapse:collapse;border-spacing:0;font-size:13px;min-width:0}
.mt th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  padding:0 12px 7px 0;border-bottom:1px solid var(--border);white-space:nowrap}
.mt td{padding:9px 12px 9px 0;border-bottom:1px solid var(--grid);vertical-align:top;color:var(--ink-2)}
.mt td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
.mt tr:last-child td{border-bottom:0}
.mt .pts{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;text-align:right;white-space:nowrap}
.mtwrap{overflow-x:auto}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:18px 0 5px}
.grp:first-child{margin-top:0}
.grpwhy{font-size:12.5px;color:var(--ink-2);margin-bottom:9px;max-width:78ch}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--surface-2);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px}

.empty{text-align:center;color:var(--muted);padding:44px 0;font-size:14px}
ol.recs{margin:0 0 0 20px;font-size:14px;color:var(--ink-2)}
ol.recs li{margin-bottom:9px}
ol.recs b{color:var(--ink)}
footer{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.7}
.warn-t{color:var(--warn,#b45309)}

/* ---- the N-of-10 benchmark ---- */
.bench{border:1px solid var(--border);border-radius:10px;padding:20px;background:var(--surface)}
.bench-top{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.bench-n{display:flex;align-items:baseline;gap:7px;flex:0 0 auto;
  font-variant-numeric:tabular-nums;line-height:1}
.bench-n b{font-size:58px;font-weight:700;color:var(--ink)}
.bench-n span{font-size:17px;color:var(--muted)}
.bench-txt{flex:1 1 380px;min-width:0}
.bench-txt h2{margin-top:0}
.bench-rows{margin-top:16px;border-top:1px solid var(--border);padding-top:12px;
  display:flex;flex-direction:column;gap:1px}
.br{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;
  padding:6px 8px;border-radius:5px;font-size:13px}
.br:hover{background:var(--surface-2)}
.br-s{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.br-q{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-i{font-size:11px;color:var(--muted)}
.br.s-cited .br-s{color:#15803d}
.br.s-mentioned .br-s{color:#a16207}
.br.s-absent .br-s{color:var(--muted)}
.br.s-unmeasured{opacity:.65}
.br.s-unmeasured .br-s{color:#7c3aed}
.br.s-unmeasured .br-q{background:repeating-linear-gradient(45deg,transparent,transparent 5px,
  var(--grid) 5px,var(--grid) 6px);border-radius:3px}

/* ---- source gap ---- */
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:12px}
.kind{border:1px solid var(--border);border-radius:8px;padding:13px;background:var(--surface-2)}
.kind.ours{border-color:#15803d}
.kind-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kind-h b{font-size:13.5px}
.kind-h span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.kind-w{font-size:12px;margin:5px 0 8px;color:var(--muted)}
.kind.ours .kind-w{color:#15803d;font-weight:600}
.kind-d{display:flex;flex-wrap:wrap;gap:4px}
.kind-d span{font-size:11.5px;background:var(--surface);border:1px solid var(--border);
  border-radius:4px;padding:2px 6px;color:var(--ink-2)}
.kind-d i{color:var(--muted);font-style:normal;font-variant-numeric:tabular-nums}

/* ---- recommendations ---- */
.rec{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;
  background:var(--surface)}
.rec-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.rec-n{width:20px;height:20px;border-radius:50%;background:var(--series-1);color:#fff;
  font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.rec-h b{font-size:14.5px;flex:1 1 auto}
.rec-m{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rec p{font-size:13.5px;color:var(--ink-2);margin:8px 0 9px}
.rec-ev{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.rec-ev span{font-size:11px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:4px;padding:2px 7px;color:var(--muted)}
.rec-me{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--grid);padding-top:8px}

/* ---- forms (lead lookup + ad-hoc query) ---- */
.lf{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.lf input{flex:1 1 170px;min-width:0;padding:9px 11px;border:1px solid var(--border);
  border-radius:6px;background:var(--surface);color:var(--ink);font-size:13.5px;
  font-family:inherit}
.lf input:focus{outline:2px solid var(--series-1);outline-offset:-1px}
.lf button{flex:0 0 auto}
.lf-sig{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:11px}
.lf-lbl{font-size:12px;color:var(--muted);flex-basis:100%}
.lf-sig label{font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;
  gap:5px;border:1px solid var(--border);border-radius:5px;padding:4px 8px;cursor:pointer}
.lf-sig label:hover{border-color:var(--series-1)}
.lf-sig i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- reconciliation, gaps, pain points ---- */
.recon{font-size:12.5px;margin:8px 0;padding:6px 10px;border-radius:5px;
  border-left:3px solid var(--border);background:var(--surface-2)}
.recon span{color:var(--muted);margin-left:7px}
.recon.v-verified{border-left-color:#15803d}
.recon.v-weak{border-left-color:#a16207}
.recon.v-mismatch{border-left-color:#b91c1c}
.recon.v-thin{border-left-color:#7c3aed}
.gaps{font-size:12px;margin:8px 0;color:var(--muted)}
.gaps b{display:block;margin-bottom:4px;color:var(--ink-2)}
.gaps span{display:block;padding:2px 0 2px 11px;border-left:2px solid var(--grid)}
.pp{margin:10px 0;border-top:1px solid var(--grid);padding-top:9px}
.pp-h{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  margin-bottom:7px}
.pp-h i{text-transform:none;letter-spacing:0;font-style:italic}
.pp-r{display:flex;gap:9px;margin-bottom:7px;align-items:flex-start}
.pp-r div{flex:1 1 auto;min-width:0}
.pp-r b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.pp-r span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.conf{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;
  border-radius:3px;padding:2px 5px;flex:0 0 auto;margin-top:2px}
.conf.c-high{background:#15803d22;color:#15803d}
.conf.c-medium{background:#a1620722;color:#a16207}
.conf.c-low{background:var(--surface-2);color:var(--muted)}
.li{font-size:11.5px;margin-left:7px;color:var(--series-1);text-decoration:none}
.li:hover{text-decoration:underline}

/* ---- ad-hoc results ---- */
.ah-r{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:9px}
.ah-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ah-h b{flex:1 1 auto}
.pill.seam{background:repeating-linear-gradient(45deg,transparent,transparent 4px,
  var(--grid) 4px,var(--grid) 5px)}

/* ---- Track A · Logic flowchart ---- */
.flegend{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.lg{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--border);
  color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.lg::before{content:"";width:9px;height:3px;border-radius:2px;background:var(--muted)}
.lg.k-free::before{background:#94a3b8}
.lg.k-paid::before{background:#b45309}
.lg.k-rules::before{background:var(--series-1)}
.lg.k-model::before{background:#7c3aed}
.lg.k-exit::before{background:#15803d}

.flow{position:relative;display:flex;flex-direction:column;gap:0}
.fstage{display:flex;gap:12px;padding:13px 14px 13px 12px;border:1px solid var(--border);
  border-left:4px solid var(--muted);border-radius:8px;background:var(--surface);
  position:relative;margin-bottom:4px}
/* the spine: a short connector drawn between consecutive stages */
.fstage::after{content:"";position:absolute;left:24px;bottom:-14px;width:2px;height:14px;
  background:var(--border);z-index:0}
.fstage:last-child::after{display:none}
.fstage.k-free{border-left-color:#94a3b8}
.fstage.k-paid{border-left-color:#b45309}
.fstage.k-rules{border-left-color:var(--series-1)}
.fstage.k-model{border-left-color:#7c3aed;background:var(--surface-2)}
.fnum{flex:0 0 auto;width:23px;height:23px;border-radius:50%;background:var(--surface-2);
  border:1px solid var(--border);color:var(--ink-2);font-size:11.5px;font-weight:700;
  display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fbody{flex:1 1 auto;min-width:0}
.fhead{display:flex;align-items:baseline;gap:9px}
.fhead b{font-size:14px}
.fcount{font-size:11.5px;font-variant-numeric:tabular-nums;background:var(--surface-2);
  border:1px solid var(--border);border-radius:11px;padding:1px 8px;color:var(--ink-2);
  flex:0 0 auto}
.fsub{font-size:13px;color:var(--ink-2);margin-top:3px}
.fnote{font-size:12.5px;color:var(--muted);margin-top:6px;padding-left:10px;
  border-left:2px solid var(--grid);max-width:88ch}
.fnote b{color:var(--ink-2)}

/* branch-offs: indented, so the eye reads them as leaving the spine */
.fexit{display:flex;align-items:baseline;gap:8px;margin:0 0 8px 34px;padding:7px 11px;
  border:1px dashed var(--border);border-radius:7px;font-size:12.5px;background:var(--surface-2)}
.farrow{color:var(--muted);font-family:ui-monospace,Menlo,monospace;flex:0 0 auto}
.fexit-l{font-weight:600;color:var(--ink)}
.fexit-w{color:var(--muted);font-size:12px}
.fexit.t-dq{border-color:#b91c1c66}
.fexit.t-rev{border-color:#7c3aed66}
.fexit.t-hot{border-color:#15803d;border-style:solid}
.fexit.t-warm{border-color:#a1620788}
.froutes{margin-bottom:6px}
@media(max-width:640px){
  .fexit{margin-left:12px;flex-wrap:wrap}
  .fnote{max-width:none}
}

/* ---- key status ---- */
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.keychip{font-size:11.5px;border:1px solid var(--border);border-radius:5px;padding:3px 8px;
  color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.keychip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.keychip.on{color:var(--ink-2)}
.keychip.on::before{background:#15803d}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>AEO Monitor <span id="brand"></span></h1>
    <div class="meta" id="runmeta">loading…</div>
    <div class="keys" id="keys"></div>
  </div>
  <div class="actions" id="actions">
    <button id="btnrun" class="primary">Run live collection</button>
    <button id="btnexport">Export standalone HTML</button>
    <button id="btntheme">Theme</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="leads" class="on">Track A — Inbound lead engine</button>
  <button data-tab="flow">Track A · Logic</button>
  <button data-tab="aeo">Track C — AI visibility</button>
</nav>

<section id="runpanel">
  <h2>Running</h2>
  <div class="progress"><i id="pbar"></i></div>
  <div id="log"></div>
</section>

<div id="app"><div class="empty">No runs yet. Press <b>Run live collection</b>.</div></div>

<footer>
  Presence, citation share and the competitor set are reported separately and never
  blended into a single visibility score — one number that moves for reasons you
  can't recover is worse than three you can act on.
  <span id="hash"></span>
</footer>

</div>

<script>
const EMBED = window.__AEO_DATA__ || null;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = n => (n == null ? "—" : n + "%");

async function api(p, o) {
  const r = await fetch(p, o);
  if (!r.ok) throw new Error(p + " -> " + r.status);
  return r.json();
}

/* ---------------------------------------------------------------- render */

function tiles(s) {
  const v = s.variance || {};
  return `<div class="tiles">
    <div class="tile"><b>${pct(s.presence_rate)}</b><span>Presence rate</span>
      <small>appears at all, across ${s.observations} live readings</small></div>
    <div class="tile"><b>${pct(s.cited_rate)}</b><span>Cited with a link</span>
      <small>the share that earns a source, not just a name</small></div>
    <div class="tile"><b>${pct(s.citation_share)}</b><span>Citation share</span>
      <small>${s.owned_citations} of ${s.total_citations} cited sources are ours</small></div>
    <div class="tile"><b>${pct(v.unstable_pct)}</b><span>Unstable cells</span>
      <small>${v.unstable_cells}/${v.repeated_cells} repeated queries changed answer between runs</small></div>
  </div>`;
}

function grid(d) {
  const by = {};
  d.grid.forEach(c => { (by[c.query_id] = by[c.query_id] || {})[c.engine] = c; });

  const head = d.engines.map(e => `<th>${esc(e.label)}</th>`).join("");
  const rows = d.queries.map(q => {
    const cells = d.engines.map(e => {
      const c = (by[q.id] || {})[e.key];
      // No row at all is still "we did not look" — it renders as a seam, never
      // as absent. Same rule as an engine with no credential.
      if (!c) return `<td class="cell s-seam" title="no reading recorded for this cell">seam</td>`;
      if (!c.live) {
        const t = esc(c.note || c.error || "not measured");
        return `<td class="cell s-seam" title="${t}">seam</td>`;
      }
      const uniq = [...new Set(c.statuses)];
      const label = uniq.length === 1 ? uniq[0] : "split";
      const cls = uniq.length === 1 ? "s-" + uniq[0] : "s-mentioned";
      const n = c.statuses.length > 1 ? `<span class="split">${c.statuses.length}×</span>` : "";
      const title = esc(c.statuses.join(" / "));
      return `<td class="cell ${cls}" title="${title}">${label}${n}</td>`;
    }).join("");
    return `<tr><td class="q">${esc(q.text)}<em>${esc(q.intent)}</em></td>${cells}</tr>`;
  }).join("");

  return `<section>
    <h2>Where we appear</h2>
    <p class="sub">One cell per query and engine. <b>Cited</b> means the answer carried a link
      to us; <b>mentioned</b> means we were named without one. They need different fixes, so
      they are different states. A hatched cell was not measured — that is not the same as
      being absent, and the grid never lets the two look alike.</p>
    <div class="gridwrap"><table>
      <thead><tr><th class="q">Query</th>${head}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="legend">
      <span><i style="background:var(--cell-cited)"></i>Cited — named with a source link</span>
      <span><i style="background:var(--cell-mentioned)"></i>Mentioned — named, no link</span>
      <span><i style="background:var(--cell-absent);border:1px solid var(--grid)"></i>Absent</span>
      <span><i class="s-seam" style="border-radius:3px"></i>Seam — not measured</span>
      <span><b>n×</b> = repeated readings; hover a cell for each one</span>
    </div>
  </section>`;
}

function bars(title, sub, rows, key, labelKey, ownedKey) {
  if (!rows.length) return `<section><h2>${title}</h2><p class="sub">${sub}</p>
    <div class="empty">Nothing recorded yet.</div></section>`;
  const max = Math.max(...rows.map(r => r[key])) || 1;
  const body = rows.map(r => {
    const owned = ownedKey && r[ownedKey];
    return `<div class="bar">
      <div class="lab" title="${esc(r[labelKey])}"><b>${esc(r[labelKey])}</b>${owned ? '<span class="tag">ours</span>' : ""}</div>
      <div class="track">
        <div class="fill ${owned ? "owned" : ""}" style="width:${Math.round(100 * r[key] / max)}%"></div>
      </div>
      <div class="n">${r[key]}</div>
    </div>`;
  }).join("");
  return `<section><h2>${title}</h2><p class="sub">${sub}</p><div class="bars">${body}</div></section>`;
}

function trend(points) {
  const real = points.filter(p => p.comparable !== false);
  if (real.length < 2) {
    return `<section><h2>Over time</h2>
      <p class="sub">Two comparable runs are needed before a line means anything.
        Runs collected under a different query set are excluded rather than drawn as a
        smooth curve — the contract hash decides comparability.</p>
      <div class="empty">${real.length} run${real.length === 1 ? "" : "s"} so far.</div></section>`;
  }
  const W = 900, H = 210, P = { t: 14, r: 116, b: 26, l: 34 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const x = i => P.l + (real.length === 1 ? iw / 2 : iw * i / (real.length - 1));
  const y = v => P.t + ih - (ih * Math.min(100, v) / 100);

  const line = (k) => real.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
  const dots = (k, c) => real.map((p, i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p[k]).toFixed(1)}" r="4"
      fill="${c}" stroke="var(--surface-1)" stroke-width="2">
      <title>${esc(p.at)} — ${p[k]}%${p.synthetic ? " (synthetic backfill)" : ""}</title></circle>`).join("");

  const gridlines = [0, 25, 50, 75, 100].map(v =>
    `<line class="gridline" x1="${P.l}" x2="${P.l + iw}" y1="${y(v)}" y2="${y(v)}"/>
     <text class="axis-lab" x="${P.l - 7}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");

  const synth = real.filter(p => p.synthetic).map((p, i) =>
    `<rect x="${x(real.indexOf(p)) - 9}" y="${P.t}" width="18" height="${ih}"
      fill="var(--grid)" opacity=".45"/>`).join("");

  const last = real[real.length - 1];
  const anyS = real.some(p => p.synthetic);

  return `<section><h2>Over time</h2>
    <p class="sub">Same queries, same engines, one point per run. Shaded columns are
      <b>synthetic backfill</b>, marked in the data itself and not just in this caption —
      you cannot know what an assistant said last month, so inventing it silently would be
      the exact error this tool exists to catch.</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Presence rate and citation share by run">
      ${synth}${gridlines}
      <line class="baseline" x1="${P.l}" x2="${P.l + iw}" y1="${y(0)}" y2="${y(0)}"/>
      <path d="${line("presence_rate")}" fill="none" stroke="var(--series-1)" stroke-width="2"/>
      <path d="${line("citation_share")}" fill="none" stroke="var(--series-2)" stroke-width="2"/>
      ${dots("presence_rate", "var(--series-1)")}${dots("citation_share", "var(--series-2)")}
      <text class="serieslab" x="${P.l + iw + 10}" y="${y(last.presence_rate) + 4}" fill="var(--series-1)">Presence ${last.presence_rate}%</text>
      <text class="serieslab" x="${P.l + iw + 10}" y="${y(last.citation_share) + 4}" fill="var(--series-2)">Citation share ${last.citation_share}%</text>
    </svg>
    ${anyS ? '<div class="note warn"><b>This chart contains synthetic backfill.</b> Only the unshaded points were measured.</div>' : ""}
  </section>`;
}

function method(s, d) {
  const v = s.variance || {};
  const unstable = v.unstable_cells || 0;
  return `<section>
    <h2>Is the instrument trustworthy?</h2>
    <p class="sub">Assistant answers are non-deterministic. Asking the same question twice
      can return a different set of names, so a single snapshot is a sample, not a
      measurement — and a monitoring tool built on one sample reports noise as signal.</p>
    <div class="note ${unstable ? "warn" : ""}">
      <b>${v.repeated_cells || 0} cells were read more than once, and ${unstable} of them
      disagreed with themselves.</b>
      ${unstable
        ? "So any movement smaller than that spread is not a result. Production would run five repeats per cell and report a rate with a confidence band, flagging change only outside the noise."
        : "Stable across repeats in this run, which is a finding rather than an assumption — it is only known because the repeats were collected."}
    </div>
    <div class="note"><b>What this does not do.</b> No composite 0–100 visibility score.
      Presence, citation share and the competitor set move for different reasons and have
      different fixes, so blending them would destroy the only actionable part.</div>
  </section>`;
}

/* ---- the headline number: a COUNT, never a percentage ---- */
const STATE_LABEL = { cited: "cited", mentioned: "mentioned", absent: "absent",
                      unmeasured: "not measured" };

function benchmarkHero(b) {
  if (!b || !b.out_of) return "";
  const unm = (b.unmeasured || []).length;
  return `<section class="bench">
    <div class="bench-top">
      <div class="bench-n">
        <b>${b.appear_in}</b><span>of ${b.out_of}</span>
      </div>
      <div class="bench-txt">
        <h2>We appear in ${b.appear_in} of ${b.out_of} buyer-intent queries</h2>
        <p class="sub">Target is <b>${b.target} of ${b.target}</b>.
          ${b.cited} earned a citation with a link; ${b.mentioned} were named with no link.
          Reported as a count, not a percentage — a percentage hides its denominator,
          and the denominator is where these dashboards go wrong.
          ${unm ? `<b class="warn-t">${unm} of the ${b.out_of} were not measured on this
            run and are excluded from the count, not scored as losses.</b>` : ""}</p>
        <p class="sub">Branded queries are deliberately <b>not</b> in the ten — asking
          "what is Nebius Academy" and counting the answer would be free marks.</p>
      </div>
    </div>
    <div class="bench-rows">
      ${b.rows.map(r => `<div class="br s-${esc(r.state)}">
        <span class="br-s">${esc(STATE_LABEL[r.state] || r.state)}</span>
        <span class="br-q">${esc(r.query)}</span>
        <span class="br-i">${esc(r.intent)}</span>
      </div>`).join("")}
    </div>
  </section>`;
}

/* ---- where competitors get cited and we do not ---- */
function sourceGap(g) {
  if (!g || !g.kinds || !g.kinds.length) {
    return `<section><h2>The source gap</h2>
      <p class="sub">No citations recorded on the lost queries yet.</p></section>`;
  }
  return `<section>
    <h2>What the answers cite instead — and what kind of thing it is</h2>
    <p class="sub">Across the <b>${g.lost_queries}</b> queries we lost. This is the half that
      turns a scoreboard into a to-do list: knowing we lose a query is not actionable,
      knowing the answers to it lean on review platforms and two competitor blogs names
      the places to go and get placed. <b>The classification is a lookup, not a model
      call</b> — a source type that changed its mind between runs would make every
      recommendation unreproducible.</p>
    <div class="kinds">
      ${g.kinds.map(k => `<div class="kind ${k.we_appear ? "ours" : ""}">
        <div class="kind-h"><b>${esc(k.label)}</b>
          <span>${k.citations} citation${k.citations === 1 ? "" : "s"}</span></div>
        <div class="kind-w">${k.we_appear ? "We appear here." : "We do not appear here."}</div>
        <div class="kind-d">${k.top_domains.map(d =>
          `<span>${esc(d.domain)} <i>${d.n}</i></span>`).join("")}</div>
      </div>`).join("")}
    </div>
  </section>`;
}

/* ---- does SEO feed AEO? measured, not asserted ---- */
function seoPanel(s) {
  if (!s || !s.queries_compared) return "";
  return `<section>
    <h2>Does SEO feed AEO?</h2>
    <p class="sub">Everyone in this category asserts an answer. Here it is measured: of the
      domains Google's AI Overview <b>cited</b>, how many were also ranking organically for
      the same query, captured from the same response.</p>
    <div class="tiles">
      <div class="tile"><b>${s.overlap_pct == null ? "—" : s.overlap_pct + "%"}</b>
        <span>Cited domains also ranking</span>
        <small>${s.also_ranking_organically} of ${s.cited_domains} cited domains appeared
          in the organic results too</small></div>
      <div class="tile"><b>${s.queries_compared}</b><span>Queries compared</span>
        <small>only AI Overviews exposes both the answer and the SERP beneath it</small></div>
    </div>
    ${s.verdict
      ? `<div class="note"><b>${esc(s.verdict)}</b></div>`
      : `<div class="note warn"><b>Too few queries to call it.</b> Reported with the sample
         size attached rather than as a figure, because on a handful of queries this number
         swings hard and a single percentage would be read as settled.</div>`}
  </section>`;
}

/* ---- the written recommendations. Loaded separately: they cost a model call,
       and the measured half of the page must render instantly and for free. ---- */
function recsPanel(r) {
  if (!r) return `<section id="recs-sec">
    <h2>Recommendations</h2>
    <p class="sub">Written from the measured evidence above — the benchmark, the source
      gap and the overlap figure — not from the raw answers. A model handed raw answers
      returns five generic bullets that would be identical for any company in any
      category; a model handed a table it cannot argue with has to be specific.</p>
    <button id="btnrecs">Generate recommendations</button>
    <div id="recs-out"></div></section>`;
  if (r.error) return `<div class="note warn"><b>Recommendations unavailable.</b>
    ${esc(r.error)}</div>`;
  return `${(r.recommendations || []).map((x, i) => `<div class="rec">
      <div class="rec-h"><span class="rec-n">${i + 1}</span>
        <b>${esc(x.title)}</b>
        <span class="rec-m">${esc(x.effort)} effort · ${esc(x.horizon)}</span></div>
      <p>${esc(x.why)}</p>
      <div class="rec-ev">${(x.evidence || []).map(e => `<span>${esc(e)}</span>`).join("")}</div>
      <div class="rec-me"><b>Measure with:</b> ${esc(x.measure_with)}</div>
    </div>`).join("")}
    ${r.seo_verdict ? `<div class="note"><b>SEO → AEO, on this evidence:</b>
      ${esc(r.seo_verdict)}</div>` : ""}`;
}

/* ---- ask one query live. NOT written into the benchmark tables. ---- */
function adhocPanel() {
  return `<section id="adhoc-sec">
    <h2>Ask an ad-hoc query</h2>
    <p class="sub">Runs live against every enabled engine right now.
      <b>Deliberately not persisted.</b> The ten queries are a fixed measurement contract
      and a trend line only means something if the question set behind it did not move —
      so a curious one-off runs, renders, and is gone.</p>
    <div class="lf">
      <input id="ah-q" placeholder='e.g. "who should we buy AI training from in Europe"'>
      <button id="ah-go">Ask</button>
    </div>
    <div id="ah-out"></div>
  </section>`;
}

function adhocResults(d) {
  return `<div class="ah-res">
    ${d.results.map(r => `<div class="ah-r">
      <div class="ah-h"><b>${esc(r.label)}</b>
        <span class="pill s-${esc(r.status)}">${esc(STATE_LABEL[r.status] || r.status)}</span>
        ${r.live ? "" : '<span class="pill seam">seam</span>'}</div>
      ${r.note ? `<div class="why">${esc(r.note)}</div>` : ""}
      ${r.error ? `<div class="why warn-t">${esc(r.error)}</div>` : ""}
      ${r.answer ? `<div class="draft">${esc(r.answer)}</div>` : ""}
      ${r.citations && r.citations.length
        ? `<div class="kind-d">${r.citations.map(c =>
            `<span>${esc(c.domain)}</span>`).join("")}</div>` : ""}
    </div>`).join("")}
    <div class="note"><b>Not saved.</b> This answer is not in the database and does not
      affect the benchmark count above.</div>
  </div>`;
}

function render(d, t) {
  $("#brand").textContent = d.brand ? "· " + d.brand : "";
  const r = d.run || {};
  /* Cost is shown next to the run, not buried in a report. On-demand running
     means the person pressing the button is the person paying for it. A run
     collected before the usage instrumentation existed shows nothing rather
     than a misleading $0.00. */
  const c = d.cost || {};
  const costTxt = c.calls
    ? ` · $${c.usd.toFixed(4)} (${c.calls} calls, ${c.searches} searches)` : "";
  $("#runmeta").textContent = r.started_at
    ? `run ${r.id} · ${r.started_at} · engines: ${r.engines || "—"}${costTxt}`
    : "no completed runs";
  $("#hash").textContent = r.query_set_hash ? " · contract " + r.query_set_hash : "";

  const s = d.summary;
  const synthBanner = r.is_synthetic
    ? `<div class="note warn" style="margin:0 0 16px"><b>Every number on this page comes from
       synthetic backfill.</b> No measured run exists in this database yet, so seeded data is
       being shown so the interface is legible. Run a live collection before reading anything
       here as a result.</div>`
    : "";

  $("#app").innerHTML =
    synthBanner +
    benchmarkHero(d.benchmark) +
    tiles(s) +
    grid(d) +
    sourceGap(d.source_gap) +
    `<div class="two">` +
      bars("Where the answers come from",
           "Domains the assistants actually cited. This is the lever: the ones you don't own are the placement target.",
           s.domains, "citations", "domain", "is_owned") +
      bars("Who owns the category today",
           "Names appearing in the answers, seeded plus discovered from cited domains.",
           s.competitors, "appearances", "name") +
    `</div>` +
    seoPanel(d.seo) +
    // In the standalone export there is no server to ask, so the recommendations are
    // baked into the payload at export time. Rendering the "Generate" button there
    // would ship a control that fetches an API over file:// and dies.
    (EMBED ? (EMBED.recommendations ? `<section><h2>Recommendations</h2>
        <p class="sub">Written from the measured evidence on this page — the benchmark,
        the source gap and the overlap figure — at the time this file was exported.</p>
        ${recsPanel(EMBED.recommendations)}</section>` : "")
           : recsPanel(null)) +
    (EMBED ? "" : adhocPanel()) +
    trend(t) +
    method(s, d) +
    (d.stale_contract
      ? `<div class="note warn"><b>This run used a different query set from the current config.</b>
         It is shown, but it is not comparable with the latest runs.</div>` : "");
}

/* -------------------------------------------------- Track A — lead engine */

const ROUTE_LABEL = {
  hot: "Hot · 5 min", warm: "Warm · 24h", revisit_6mo: "Revisit in 6 months",
  hold: "Hold", disqualified: "Disqualified", needs_review: "Human review",
  capped: "Not processed · spend cap",
};

const RECON_LABEL = {
  verified: "verified against the email domain",
  weak: "weak match — company name only, website differs",
  mismatch: "MISMATCH — probably a different person",
  thin: "nothing found to reconcile",
};

function leadTiles(s) {
  return `<div class="tiles">
    <div class="tile"><b>${s.total}</b><span>Leads processed</span>
      <small>end to end: look up → reconcile → score → route → draft</small></div>
    <div class="tile"><b>${s.routes.hot || 0}</b><span>Hot</span>
      <small>fit AND intent both clear the bar — 5-minute SLA</small></div>
    <div class="tile"><b>${s.disqualified}</b><span>Disqualified</span>
      <small>checked before scoring, and absolute</small></div>
    <div class="tile"><b>${s.needs_review}</b><span>Human review</span>
      <small>couldn't be looked up, or didn't reconcile — not the same as scoring badly</small></div>
    <div class="tile"><b>$${(s.cost_usd || 0).toFixed(3)}</b><span>Anthropic cost</span>
      <small>read from response.usage, not estimated — Serper and Apify bill separately</small></div>
  </div>`;
}

/* The form. This is the whole point of the tab: type a real person, watch it
   go and find them. It posts to /api/leads/one, which runs the SAME pipeline
   as the batch button with a one-item list. */
function leadForm() {
  const SIGNALS = [
    ["completed_assessment", "Completed the AI readiness assessment", 25],
    ["booked_demo", "Booked a demo", 30],
    ["pricing_page", "Visited pricing", 15],
    ["webinar_attended", "Attended a webinar", 12],
    ["webinar_registered", "Registered for a webinar (didn't attend)", 6],
    ["content_download", "Downloaded content", 5],
  ];
  return `<section id="leadform-sec">
    <h2>Look up a real lead</h2>
    <p class="sub">Name, surname and a work email. Serper finds the LinkedIn profile,
      two Apify actors read the person and the company, and the record is
      <b>reconciled against the email domain</b> before anything is scored — because the
      top search hit for a common name is a different real person often enough that an
      unchecked record would be confidently wrong rather than blank.
      Costs about <b>$0.025</b> per lookup.</p>
    <div class="lf">
      <input id="lf-first" placeholder="First name" autocomplete="off">
      <input id="lf-last" placeholder="Surname" autocomplete="off">
      <input id="lf-email" placeholder="work@company.com" autocomplete="off">
      <button id="lf-go" class="primary">Find, score &amp; draft</button>
    </div>
    <div class="lf-sig">
      <span class="lf-lbl">First-party behaviour (optional, and this is what decides hot):</span>
      ${SIGNALS.map(([k, label, pts]) =>
        `<label><input type="checkbox" value="${k}"> ${esc(label)} <i>+${pts}</i></label>`).join("")}
    </div>
    <div class="note"><b>Leave every box unticked and this lead cannot go hot, however
      good the company is.</b> That is the intent gate working, not a bug — we would know
      who they are and nothing about whether they want anything. Tick <i>Booked a demo</i>
      on the same person and watch the route change.</div>
    <div id="lf-out"></div>
  </section>`;
}

function painPoints(l) {
  if (!l.pain_points || !l.pain_points.length) return "";
  return `<div class="pp">
    <div class="pp-h">Inferred pain points <i>— the model's reading of the evidence,
      not facts about the account</i></div>
    ${l.pain_points.map(p => `<div class="pp-r">
      <span class="conf c-${esc(p.confidence)}">${esc(p.confidence)}</span>
      <div><b>${esc(p.pain)}</b><span>${esc(p.evidence)}</span></div>
    </div>`).join("")}
  </div>`;
}

function leadCard(l) {
  const bd = (l.breakdown || []).map(r =>
    `<span>${esc(r.factor)}: ${esc(r.detail)} <b>+${r.points}</b></span>`).join("");

  /* Gaps are rendered SEPARATELY from the score and never as "+0". A factor we
     could not measure and a factor that measured zero are different claims. */
  const gaps = (l.gaps || []).length
    ? `<div class="gaps"><b>Not scored — and not scored as zero:</b>
        ${l.gaps.map(g => `<span>${esc(g.factor)}: ${esc(g.why)}</span>`).join("")}</div>` : "";

  const rec = l.reconciliation && l.reconciliation.verdict
    ? `<div class="recon v-${esc(l.reconciliation.verdict)}">
         <b>${esc(RECON_LABEL[l.reconciliation.verdict] || l.reconciliation.verdict)}</b>
         ${l.reconciliation.detail ? `<span>${esc(l.reconciliation.detail)}</span>` : ""}</div>` : "";

  const draft = l.message
    ? `<div class="draft">${esc(l.message)}</div>
       <div class="ev ${l.evidence && l.evidence.length ? "" : "none"}">
         ${(l.evidence || []).map(e => `<span>${esc(e)}</span>`).join("")
           || '<span>no specific fact cited — this is a mail-merge</span>'}
       </div>`
    : (l.error ? `<div class="why">${esc(l.error)}</div>` : "");

  const growth = l.headcount_growth
    ? ` · headcount ${esc(l.headcount_growth)}` : "";

  return `<div class="lead">
    <div class="lead-head">
      <div class="lead-who">
        <b>${esc(l.name || l.email)}</b>
        ${l.linkedin_url ? `<a class="li" href="${esc(l.linkedin_url)}" target="_blank" rel="noopener">profile ↗</a>` : ""}
        <span>${esc(l.title || "—")}${l.company ? " · " + esc(l.company) : ""}
          ${l.headcount ? " · " + l.headcount.toLocaleString() + " staff" : ""}${growth} · ${esc(l.email)}</span>
      </div>
      <div class="lead-right">
        ${l.score != null ? `<div class="score">${l.score} <small>pts · intent ${l.intent == null ? "—" : l.intent}</small></div>` : ""}
        <span class="pill r-${esc(l.route)}">${esc(ROUTE_LABEL[l.route] || l.route)}</span>
      </div>
    </div>
    ${rec}
    ${bd ? `<div class="bd">${bd}</div>` : ""}
    ${gaps}
    <div class="why">${esc(l.disqualified || l.route_why || "")}</div>
    ${painPoints(l)}
    ${draft}
  </div>`;
}

function scoringMethod(m) {
  const icp = m.icp || {};
  const rows = (list, fmt) => list.map(r =>
    `<tr><td>${esc(fmt(r).what)}</td><td>${esc(fmt(r).detail)}</td><td class="pts">+${r.points}</td></tr>`).join("");

  const hc = `<div class="grp">Company size</div>
    <div class="grpwhy">${esc(icp.headcount.why || "")}</div>
    <div class="mtwrap"><table class="mt">
      <thead><tr><th>Band</th><th>Meaning</th><th class="pts">Points</th></tr></thead>
      <tbody>${icp.headcount.bands.map(b => `<tr>
        <td>${b.min.toLocaleString()}–${b.max > 99999 ? "∞" : b.max.toLocaleString()}</td>
        <td>${b.min >= 5000 ? "Enterprise L&amp;D function with its own budget"
             : b.min >= 1000 ? "Dedicated L&amp;D team, platform decision is real"
             : "Has an L&amp;D owner, may not have a platform budget yet"}</td>
        <td class="pts">+${b.points}</td></tr>`).join("")}</tbody></table></div>
    <div class="grpwhy">Below ${icp.headcount.floor} staff there is no L&amp;D function to sell a platform to,
      so it is a disqualifier rather than a low score.</div>`;

  const sen = `<div class="grp">Seniority</div>
    <div class="grpwhy">Derived from the job title by these rules — never taken from a provider's own
      "seniority" field. Every vendor uses a different taxonomy, so importing theirs means our score
      silently changes meaning the day we switch vendor. The title is the raw fact; the tier is our judgement.</div>
    <div class="mtwrap"><table class="mt">
      <thead><tr><th>Tier</th><th>Matches on</th><th class="pts">Points</th></tr></thead>
      <tbody>${rows(icp.seniority, r => ({what: r.label, detail: r.match.join(", ")}))}</tbody></table></div>`;

  const fn = `<div class="grp">Function &amp; industry</div>
    <div class="grpwhy">Function decides whether they sit on the buying committee at all. Industry is a
      weaker signal and is weighted accordingly — it moves a lead between queues, never into one.</div>
    <div class="mtwrap"><table class="mt">
      <tbody>${rows(icp.function, r => ({what: r.label, detail: r.match.join(", ")}))}
             ${rows(icp.industry, r => ({what: "Industry", detail: r.match.join(", ")}))}</tbody></table></div>`;

  const intent = `<div class="grp">Intent — what they did</div>
    <div class="grpwhy"><b>First-party data, and it is both the most reliable input we have and the
      cheapest.</b> Third-party firmographics are bought, stale and inconsistent between vendors;
      behavioural signals come from our own systems, are current to the minute, and cost nothing.
      Most scoring models weight them too low because firmographics are easier to buy than behaviour
      is to instrument — a statement about procurement, not about predictiveness.</div>
    <div class="mtwrap"><table class="mt">
      <tbody>${rows(icp.intent, r => ({what: r.signal.replace(/_/g, " "),
        detail: r.points >= 25 ? "Strong buying signal — clears the intent gate on its own"
              : r.points >= 12 ? "Real engagement, not enough alone"
              : "Weak signal; counts, but will not open the sales lane"}))}</tbody></table></div>`;

  const routes = `<div class="grp">Routing</div>
    <div class="grpwhy">Two gates, not one. Fit says "worth talking to"; intent says "now".</div>
    <div class="mtwrap"><table class="mt">
      <thead><tr><th>Route</th><th>Requires</th><th>SLA</th></tr></thead>
      <tbody>${(m.routing || []).map(r => `<tr>
        <td>${esc(ROUTE_LABEL[r.route] || r.route)}</td>
        <td>${r.min_score}+ points${r.min_intent ? ` <b>and</b> ${r.min_intent}+ intent` : ""}
          <br><span style="color:var(--muted)">${esc(r.why || "")}</span></td>
        <td>${r.sla_minutes ? (r.sla_minutes >= 60 ? Math.round(r.sla_minutes / 60) + "h" : r.sla_minutes + " min") : "—"}</td>
      </tr>`).join("")}</tbody></table></div>`;

  return `<section>
    <h2>Why the scoring is what it is</h2>
    <p class="sub">Every weight below is read live from <code>config/leads.yaml</code>, so this
      explanation cannot drift from the rules it is explaining — the commonest way a scoring model
      ends up documented as something it no longer is. Sales should be able to read that file and
      argue with it; they are the ones who feel it when it is wrong.</p>
    ${hc}${sen}${fn}${intent}${routes}
  </section>`;
}

function enrichmentMethod(m) {
  const e = m.enrichment || {};
  return `<section>
    <h2>Enrichment — mocked here, this in production</h2>
    <p class="sub">${esc(e.strategy || "")}</p>
    <div class="grp">The waterfall, cheapest first</div>
    <div class="mtwrap"><table class="mt">
      <thead><tr><th>Step</th><th>Gives</th><th>Cost</th><th>Why it sits here</th></tr></thead>
      <tbody>${(e.waterfall || []).map(w => `<tr>
        <td>${esc(w.provider)}</td><td>${esc(w.gives)}</td>
        <td style="white-space:nowrap">${esc(w.cost)}</td><td>${esc(w.why)}</td></tr>`).join("")}
      </tbody></table></div>

    <div class="grp">What we need, and how we know it is not wrong</div>
    <div class="grpwhy">A field nobody verifies is a field that will eventually be wrong without
      anyone noticing. Each row names the check and what breaks if it fails.</div>
    <div class="mtwrap"><table class="mt">
      <thead><tr><th>Field</th><th>Source</th><th>Verification</th><th>Risk if wrong</th></tr></thead>
      <tbody>${(e.fields || []).map(f => `<tr>
        <td>${esc(f.field)}</td><td>${esc(f.source)}</td>
        <td>${esc(f.verify)}</td><td>${esc(f.risk)}</td></tr>`).join("")}
      </tbody></table></div>
  </section>`;
}

function renderLeads(d) {
  const s = d.summary;
  const genericWarn = s.generic_drafts
    ? `<div class="note warn"><b>${s.generic_drafts} draft(s) cited no specific fact.</b>
       That is a mail-merge with a name in it. The model is asked to declare which
       record fields it leaned on, so this is checkable rather than assumed.</div>` : "";

  const redacted = d.redacted
    ? `<div class="note"><b>Personal fields are redacted in this export.</b> Track A
       scrapes real people, and this file is meant to be shared — so names, work emails,
       profile URLs and the drafted messages are stripped, while everything needed to
       judge the method survives: the score, every point that made it, the routing and
       its reasoning, the reconciliation verdict and the company firmographics.
       Run the app locally to see the unredacted records.</div>` : "";

  $("#app").innerHTML =
    leadTiles(s) +
    redacted +
    (EMBED ? "" : leadForm()) +
    `<section>
      <h2>Every lead, and why it went where it went</h2>
      <p class="sub">Enrichment, then disqualification, then scoring, then routing, then the
        draft. <b>Rules decide and the model writes</b> — scoring is arithmetic over
        <code>config/leads.yaml</code>, because a model asked to score a lead out of 100
        returns a confident number it can't reproduce twice and nobody can audit. Every
        point below shows where it came from.</p>
      ${genericWarn}
      ${d.leads.map(leadCard).join("")}
    </section>` +
    (d.method ? scoringMethod(d.method) + enrichmentMethod(d.method) : "") +
    `<section>
      <h2>Three decisions worth arguing about</h2>
      <div class="note"><b>Disqualifiers run before scoring, and they are absolute.</b>
        A strong firmographic profile must never outvote "personal email, no company".
        Scoring a disqualified lead and letting it win on points is the commonest way
        one of these quietly poisons a pipeline.</div>
      <div class="note"><b>Unenrichable is not low-scoring.</b> A lead we couldn't look up
        goes to a human, not to the bottom of the list. "We don't know" and "we know it's
        weak" are different states — and conflating them silently bins real buyers, because
        nobody goes looking for the leads that never arrived.</div>
      <div class="note warn"><b>Fit and intent are separate gates.</b> The first version routed
        on the total alone and sent someone who registered for a webinar and never attended
        straight to sales on a five-minute SLA, earned purely on headcount and job title.
        A big company with the right title is not a buying signal.</div>
      <div class="note warn"><b>Search only ever proposes.</b> The top result for a common
        name is a different real person often enough that accepting it unchecked would
        attach a stranger's career to a real lead — and it would score <i>well</i>, not
        badly, because every field would look complete. Every record is reconciled against
        the email domain, which is the one fact no search engine suggested to us. A
        mismatch goes to a human and never reaches the scorer.</div>
      <div class="note"><b>Financials are never guessed.</b> Revenue, valuation and funding
        are not obtainable for most private companies, and a model asked for them returns a
        fluent, specific, unfalsifiable number. They are recorded as explicit unknowns worth
        zero points. <b>Headcount growth is the real proxy</b> — and because LinkedIn
        publishes today's number and no history, it is <i>measured</i> across two sightings
        rather than looked up, so it reads "not yet measured" on first contact instead of
        drawing a 0% that looks flat.</div>
    </section>`;
}

/* ------------------------------------- Track A · Logic — the live flowchart */

/* Not a picture of the design — a picture of the LAST RUN. Every node carries
   the count that actually went through it, so the diagram and the code cannot
   drift apart: if a branch never fires, its node reads 0 and says so. A static
   flowchart in a README is a claim; this is the same claim with evidence. */
function flowChart(d) {
  const L = d.leads || [];
  const n = f => L.filter(f).length;
  const routes = (d.summary && d.summary.routes) || {};

  const total     = L.length;
  const personal  = n(l => l.route === "disqualified" && !l.linkedin_url && !l.headcount);
  const disqOther = (routes.disqualified || 0) - personal;
  const recon     = k => n(l => (l.reconciliation || {}).verdict === k);
  const mismatch  = recon("mismatch") + recon("thin");
  const scored    = n(l => l.score != null);
  const drafted   = n(l => l.message);

  /* kind drives the left accent + legend: what KIND of step is this?
     The whole argument of Track A is that these are different kinds of thing
     and the expensive/fallible ones are fenced off from the deciding ones. */
  const stage = (num, kind, title, sub, count, note) => `
    <div class="fstage k-${kind}">
      <div class="fnum">${num}</div>
      <div class="fbody">
        <div class="fhead"><b>${title}</b>
          ${count != null ? `<span class="fcount">${count}</span>` : ""}</div>
        <div class="fsub">${sub}</div>
        ${note ? `<div class="fnote">${note}</div>` : ""}
      </div>
    </div>`;

  const exit = (label, count, why, tone) => `
    <div class="fexit t-${tone || ""}">
      <span class="farrow">└─▶</span>
      <span class="fexit-l">${esc(label)}</span>
      <span class="fcount">${count}</span>
      <span class="fexit-w">${why}</span>
    </div>`;

  return `<section>
    <h2>How a lead becomes a decision</h2>
    <p class="sub">The live pipeline, with the counts from the last run on every node —
      not an illustration of it. If a branch never fires it reads <b>0</b> here, so the
      diagram cannot quietly drift away from the code it describes.
      <b>Read the left edge:</b> the colour is what <i>kind</i> of step it is, and the
      whole design is about keeping those kinds apart — the fallible steps
      (search, scrape, model) are fenced off from the deciding steps (rules).</p>

    <div class="flegend">
      <span class="lg k-free">free</span>
      <span class="lg k-paid">paid call</span>
      <span class="lg k-rules">rules — deterministic</span>
      <span class="lg k-model">model</span>
      <span class="lg k-exit">terminal route</span>
    </div>

    <div class="flow">
      ${stage(1, "free", "Inbound lead", "Name, surname, work email. Behaviour (assessment, demo, webinar) rides along as first-party signals.", total,
        "The email <b>domain</b> is the only fact here that no search engine proposed to us. Everything downstream is checked against it.")}

      ${stage(2, "free", "Domain heuristics", "Free-mail detection, before a single credit is spent.", null,
        "A personal mailbox has no company behind it, so the paid lookups are <b>skipped, not spent proving it</b>.")}
      ${exit("Disqualified — personal mailbox", personal, "0 paid calls made", "dq")}

      ${stage(3, "paid", "Serper → LinkedIn profile", '<code>site:linkedin.com/in "Name" "Company"</code> — the hop between a name and a URL.', null,
        "~$0.001. ⚠️ This only ever <b>proposes</b>: the top hit for a common name is a different real person often enough to matter.")}

      ${stage(4, "paid", "Apify — person, then company", "Structured current position and employer; then employeeCount, industry, HQ, description.", null,
        "~$0.02 for both. The person record hands us the employer's own LinkedIn URL, which is a better company key than anything we could guess.")}

      ${stage(5, "rules", "Reconcile against the email domain", "Does the scraped company's own website match the domain the lead typed?", null,
        "🔑 <b>The step that makes everything after it trustworthy.</b> An unreconciled record is not a blank — it is a stranger's career attached to a real name, and it would score <i>well</i>, not badly, because every field looks complete.")}
      ${exit("Human review — mismatch or nothing found", mismatch, "never reaches the scorer", "rev")}

      ${stage(6, "rules", "Disqualifiers", "Blocked roles, excluded industries, headcount floor. Absolute, and checked before scoring.", null,
        "A strong firmographic profile must never outvote a hard exclusion — letting it is the commonest way one of these quietly poisons a pipeline.")}
      ${exit("Disqualified — rule hit", Math.max(disqOther, 0), "not a low score; not a lead", "dq")}

      ${stage(7, "rules", "Score — arithmetic, not a prompt", "Headcount · headcount growth · seniority · function · industry · intent. Every point shows its source.", scored,
        "Ask a model to score a lead out of 100 and you get a confident number it cannot reproduce twice and no salesperson can argue with. Unmeasurable factors go to <b>gaps</b> — never scored as zero.")}

      ${stage(8, "rules", "Route — two gates, not one", "Fit says <i>worth talking to</i>. Intent says <i>now</i>. Both, or it isn't now.", null,
        "⚠️ Routing on the total alone once sent a webinar no-show to sales on a 5-minute SLA, earned purely on headcount and job title.")}
      <div class="froutes">
        ${exit("Hot · 5 min", routes.hot || 0, "fit ≥ 70 AND intent ≥ 25", "hot")}
        ${exit("Warm · 24h", routes.warm || 0, "fit ≥ 45", "warm")}
        ${exit("Revisit in 6 months", routes.revisit_6mo || 0, "fit ≥ 20, no buying signal yet", "rev6")}
        ${exit("Hold", routes.hold || 0, "insufficient fit; kept for re-testing", "hold")}
      </div>

      ${stage(9, "model", "The two things rules cannot do", "Infer this company's likely AI-adoption problem, then write a sentence a person would write.", drafted,
        "The <b>only</b> model call in the pipeline. It must declare which record fields it leaned on — a draft citing nothing is a mail-merge in costume, and the dashboard counts those.")}
    </div>

    <div class="note"><b>Everything above the model step is reproducible.</b> Same lead,
      same config, same score and same route — every time. The model never touches the
      number, the routing or the SLA; it writes prose from a decision that was already
      made. That is the line the whole design is drawn around, and it is why the score
      can be argued with.</div>
  </section>`;
}

/* ------------------------------------------------------------------ load */

let TAB = "leads";
let CONFIG = null;

/* Which credentials are present, and what each one turns on. PRESENCE ONLY —
   the value is never sent to the browser, so this is safe to leave on screen
   during a recorded walkthrough. It is also the answer to "can someone else run
   this?": add a key to .env, restart, the chip goes green and the seam closes. */
function keyChips(keys) {
  if (!keys || !keys.length) return;
  const el = $("#keys");
  if (!el) return;
  el.innerHTML = keys.map(k =>
    `<span class="keychip ${k.present ? "on" : ""}" title="${esc(k.unlocks)}">
       ${esc(k.name)} ${k.present ? "set" : "not set"}</span>`).join("");
}

async function load() {
  if (!EMBED && !CONFIG) {
    try { CONFIG = await api("/api/config"); keyChips(CONFIG.keys); } catch (e) { /* offline export */ }
  }
  if (TAB === "leads" || TAB === "flow") {
    const d = EMBED ? EMBED.leads : await api("/api/leads");
    if (!d || d.empty) {
      $("#app").innerHTML = TAB === "flow"
        ? '<div class="empty">No lead run yet — the flowchart shows counts from a real run. Press <b>Run lead engine</b>.</div>'
        : '<div class="empty">No lead run yet. Press <b>Run lead engine</b>.</div>';
      return;
    }
    $("#app").innerHTML = "";
    if (TAB === "flow") $("#app").innerHTML = flowChart(d);
    else renderLeads(d);
    $("#runmeta").textContent = `lead run ${d.run.id} · ${d.run.started_at} · fit ${d.run.fit_hash}`;
    return;
  }
  const d = EMBED ? EMBED.report : await api("/api/report");
  if (!d || d.empty) {
    $("#app").innerHTML = '<div class="empty">No completed run in this export.</div>';
    return;
  }
  render(d, EMBED ? EMBED.trend : await api("/api/trend"));
}

/* ------------------------------------------------------------- live run */

async function poll() {
  const st = await api("/api/status");
  $("#pbar").style.width = st.steps ? (100 * st.step / st.steps) + "%" : "0%";
  $("#log").textContent = st.log.map(e =>
    e.event === "error" ? "ERROR " + e.message
    : `[${String(e.step).padStart(3)}/${e.steps}] ${e.engine.padEnd(14)}` +
      `${String(e.status).padEnd(10)}${String(e.citations).padStart(2)} cites  ` +
      `${e.query.slice(0, 44)}${e.live ? "" : "   [seam]"}`
  ).join("\n");
  $("#log").scrollTop = 1e6;
  if (st.running) { setTimeout(poll, 600); return; }
  $("#btnrun").disabled = false;
  $("#btnrun").textContent = runLabel();
  await load();
}

/* The Logic tab reads the same lead run, so its button runs the same thing. */
const runLabel = () => TAB === "aeo" ? "Run live collection" : "Run lead engine";

// Tabs work in the standalone export too, so a reviewer with no server can
// still see both tracks.
$("#tabs").onclick = async (e) => {
  const b = e.target.closest("button[data-tab]");
  if (!b || b.classList.contains("on")) return;
  [...$("#tabs").children].forEach(x => x.classList.toggle("on", x === b));
  TAB = b.dataset.tab;
  const run = $("#btnrun");
  if (run) run.textContent = runLabel();
  $("#app").innerHTML = '<div class="empty">loading…</div>';
  await load();
};

if (!EMBED) {
  $("#btnrun").onclick = async () => {
    $("#btnrun").disabled = true;
    $("#btnrun").textContent = "Running…";
    $("#runpanel").classList.add("on");
    $("#log").textContent = "";
    await api(TAB === "aeo" ? "/api/run" : "/api/leads/run", { method: "POST" });
    poll();
  };
  $("#btnexport").onclick = async () => {
    $("#btnexport").disabled = true;
    const r = await api("/api/export", { method: "POST" });
    $("#btnexport").textContent = "Written to " + r.path.split(/[\\/]/).pop();
    setTimeout(() => { $("#btnexport").disabled = false; $("#btnexport").textContent = "Export standalone HTML"; }, 4000);
  };
} else {
  $("#actions").innerHTML = '<button id="btntheme">Theme</button>';
}

/* One delegated handler for everything rendered after load. The panels are
   re-created on every render, so binding directly would go stale. */
document.addEventListener("click", async e => {
  const t = e.target;
  if (!t) return;

  if (t.id === "btntheme") {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    return;
  }

  /* ---- Track A: look up one real person ---- */
  if (t.id === "lf-go") {
    const email = $("#lf-email").value.trim();
    const out = $("#lf-out");
    if (!email.includes("@")) {
      out.innerHTML = `<div class="note warn"><b>A work email is required.</b> The domain is
        the only fact the reconciliation check can trust — it is the one thing a search
        engine did not propose to us.</div>`;
      return;
    }
    t.disabled = true; t.textContent = "Looking up…";
    out.innerHTML = `<div class="empty">Serper → LinkedIn profile → company page →
      reconcile → score → draft. About 20 seconds.</div>`;
    try {
      const body = {
        first_name: $("#lf-first").value, last_name: $("#lf-last").value, email,
        signals: [...document.querySelectorAll(".lf-sig input:checked")].map(i => i.value),
      };
      const r = await api("/api/leads/one",
        { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body) });
      out.innerHTML = r.error
        ? `<div class="note warn"><b>Lookup failed.</b> ${esc(r.error)}</div>`
        : (r.lead ? leadCard(r.lead) : '<div class="note warn">No lead returned.</div>');
    } catch (err) {
      out.innerHTML = `<div class="note warn">${esc(String(err))}</div>`;
    }
    t.disabled = false; t.textContent = "Find, score & draft";
    return;
  }

  /* ---- Track C: ad-hoc live query ---- */
  if (t.id === "ah-go") {
    const q = $("#ah-q").value.trim();
    if (!q) return;
    t.disabled = true; t.textContent = "Asking…";
    $("#ah-out").innerHTML = '<div class="empty">asking every enabled engine…</div>';
    try {
      const r = await api("/api/adhoc",
        { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q }) });
      $("#ah-out").innerHTML = r.error
        ? `<div class="note warn">${esc(r.error)}</div>` : adhocResults(r);
    } catch (err) {
      $("#ah-out").innerHTML = `<div class="note warn">${esc(String(err))}</div>`;
    }
    t.disabled = false; t.textContent = "Ask";
    return;
  }

  /* ---- Track C: generate the written recommendations ---- */
  if (t.id === "btnrecs") {
    t.disabled = true; t.textContent = "Writing…";
    $("#recs-out").innerHTML = '<div class="empty">reading the benchmark, the source gap ' +
      'and the overlap figure…</div>';
    try {
      const r = await api("/api/recommendations");
      $("#recs-out").innerHTML = recsPanel(r);
    } catch (err) {
      $("#recs-out").innerHTML = `<div class="note warn">${esc(String(err))}</div>`;
    }
    t.disabled = false; t.textContent = "Regenerate";
  }
});

/* Enter submits the field it is in. */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const id = e.target && e.target.id;
  if (id === "ah-q") $("#ah-go").click();
  if (id === "lf-first" || id === "lf-last" || id === "lf-email") $("#lf-go").click();
});

load();
</script>
</body>
</html>
